name: SSH qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.9.1
          runtime: node@24.18.0
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - name: Native Unix SSH fixture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y openssh-server tmux; else brew install tmux; fi
          SSH_MANAGER_NATIVE_TESTS=1 SSH_MANAGER_SSHD="$(command -v sshd)" SSH_MANAGER_TMUX="$(command -v tmux)" pnpm test
      - name: Native Windows OpenSSH fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sshd = Join-Path $env:WINDIR 'System32/OpenSSH/sshd.exe'
          if (!(Test-Path $sshd)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }
          if (!(Test-Path $sshd)) { throw 'Windows OpenSSH server unavailable' }
          $env:SSH_MANAGER_WINDOWS_TESTS = '1'
          $env:SSH_MANAGER_SSHD = $sshd
          node --test packages/ssh-manager/test/windows-openssh.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export exact committed candidate
        run: pnpm artifact
      - name: Verify exported inventory and record its digest
        shell: bash
        run: |
          MANIFEST_SHA256=$(node -e 'const fs=require("node:fs"), crypto=require("node:crypto"); console.log(crypto.createHash("sha256").update(fs.readFileSync("dist/artifact/runtime/ARTIFACT-MANIFEST.json")).digest("hex"))')
          pnpm artifact:verify dist/artifact/runtime "$MANIFEST_SHA256" "$GITHUB_SHA"
          printf '### Runtime candidate (%s)\n\nSource: `%s`\n\nManifest SHA-256: `%s`\n\nNot a published release or live installation.\n' "$RUNNER_OS" "$GITHUB_SHA" "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssh-runtime-${{ matrix.os }}
          path: dist/artifact/runtime
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.9.1
          runtime: node@24.18.0
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install isolated CI browser tooling (never at MCP startup)
        run: |
          BROWSER_PREFIX="$RUNNER_TEMP/ssh-browser-tools"
          npm install --global --prefix "$BROWSER_PREFIX" agent-browser@0.38.2
          echo "$BROWSER_PREFIX/bin" >> "$GITHUB_PATH"
          "$BROWSER_PREFIX/bin/agent-browser" install --with-deps
      - name: Qualify browser terminal with temporary credentials and state
        run: pnpm test
        env:
          SSH_MANAGER_BROWSER_TESTS: "1"
